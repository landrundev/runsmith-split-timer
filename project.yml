name: RunsmithSplitTimer
options:
  bundleIdPrefix: com.runsmith
  deploymentTarget:
    iOS: "16.0"
  defaultConfig: Debug
  xcodeVersion: "15"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO

targets:
  RunsmithSplitTimer:
    type: application
    platform: iOS
    sources:
      - path: SplitDeck
        excludes:
          - "**/.DS_Store"
    resources:
      - path: SplitDeck/Persistence/SplitDeck.xcdatamodeld
    info:
      path: SplitDeck/App/Info.plist
      properties:
        CFBundleName: Runsmith Split Timer
        CFBundleDisplayName: Runsmith Split Timer
        CFBundleIdentifier: com.runsmith.splitdeck
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Runsmith needs camera access to scan QR codes for multi-coach race sharing."
        NSPhotoLibraryAddUsageDescription: "Save race result cards to your photo library."
        UIRequiresFullScreen: NO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runsmith.splitdeck
        INFOPLIST_FILE: SplitDeck/App/Info.plist
        MARKETING_VERSION: "1.7"
        CURRENT_PROJECT_VERSION: "26"
        DEVELOPMENT_TEAM: "8N9TUSKDW3"
        CODE_SIGN_STYLE: Automatic
