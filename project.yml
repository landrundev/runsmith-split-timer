name: RunsmithSplitTimer
options:
  bundleIdPrefix: com.runsmith
  deploymentTarget:
    iOS: "16.0"
  defaultConfig: Debug
  xcodeVersion: "15"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO

targets:
  RunsmithSplitTimer:
    type: application
    platform: iOS
    sources:
      - path: SplitDeck
        excludes:
          - "**/.DS_Store"
    resources:
      - path: SplitDeck/Persistence/SplitDeck.xcdatamodeld
    info:
      path: SplitDeck/App/Info.plist
      properties:
        CFBundleName: Runsmith Split Timer
        CFBundleDisplayName: Runsmith Split Timer
        CFBundleIdentifier: com.runsmith.splitdeck
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Runsmith needs camera access to scan QR codes for multi-coach race sharing."
        NSPhotoLibraryAddUsageDescription: "Save race result cards to your photo library."
        UIRequiresFullScreen: NO
        LSSupportsOpeningDocumentsInPlace: YES
        CFBundleDocumentTypes:
          - CFBundleTypeName: Runsmith Timing Data
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.runsmith.splitdeck.timing-data
        UTExportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.json
              - public.data
            UTTypeDescription: Runsmith Timing Data
            UTTypeIdentifier: com.runsmith.splitdeck.timing-data
            UTTypeTagSpecification:
              public.filename-extension:
                - runsmith
              public.mime-type: application/x-runsmith
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runsmith.splitdeck
        INFOPLIST_FILE: SplitDeck/App/Info.plist
        MARKETING_VERSION: "2.2.0"
        CURRENT_PROJECT_VERSION: "42"
        DEVELOPMENT_TEAM: "8N9TUSKDW3"
        CODE_SIGN_STYLE: Automatic

  RunsmithSplitTimerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SplitDeckTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: RunsmithSplitTimer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: "8N9TUSKDW3"
        CODE_SIGN_STYLE: Automatic
